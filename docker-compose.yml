name: eventrelay

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: events
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d events']
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: app
      PGPASSWORD: app
      PGDATABASE: events
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ['/bin/sh', '-c']
    command:
      - psql -f /migrations/001_init.sql && echo 'Migration complete'
    restart: 'no'

  consumer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: consumer
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      DATABASE_URL: postgresql://app:app@postgres:5432/events
      TELEGRAM_DEFAULT_CHAT_ID: ${TELEGRAM_DEFAULT_CHAT_ID}
      CONSUMER_PORT: 3002
      DB_SYNCHRONIZE: 'false'
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - '3002:3002'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3002/api/v1/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  producer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: producer
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      PRODUCER_PORT: 3001
    depends_on:
      rabbitmq:
        condition: service_healthy
      consumer:
        condition: service_healthy
    ports:
      - '3001:3001'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/api/v1/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  telegram:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: telegram
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      DATABASE_URL: postgresql://app:app@postgres:5432/events
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_DEFAULT_CHAT_ID: ${TELEGRAM_DEFAULT_CHAT_ID}
      TELEGRAM_PORT: 3003
      DB_SYNCHRONIZE: 'false'
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      consumer:
        condition: service_healthy
    ports:
      - '3003:3003'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3003/api/v1/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
